name: Build Windows

"on":
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Show SDK info
        run: dotnet --info

      - name: Pack portable ZIP (x64)
        shell: pwsh
        working-directory: source
        run: pwsh ./__assets/win/script-pack-win-zip.ps1 -Platform x64

      - name: Pack MSIX sideload (x64)
        shell: pwsh
        working-directory: source
        run: pwsh ./__assets/win/script-pack-win-msix.ps1 -Platform x64 -Sign -UnvirtualizedResources

      - name: List bundle output
        shell: pwsh
        working-directory: source
        run: Get-ChildItem ./__artifacts/bundle | Format-Table Name, Length

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ImageGlass-win-x64-zip
          path: source/__artifacts/bundle/*.zip
          if-no-files-found: error

      - name: Upload MSIX installer
        uses: actions/upload-artifact@v7
        with:
          name: ImageGlass-win-x64-msix
          path: source/__artifacts/bundle/*.msix
          if-no-files-found: error
